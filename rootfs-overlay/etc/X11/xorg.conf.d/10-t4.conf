Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
EndSection
Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "s0"
    Device "fb"
EndSection
Section "InputClass"
    Identifier "bt532 touch"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
    Option "EmulateThirdButton" "1"
EndSection
Section "InputClass"
    Identifier "nav keys"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
Section "ServerLayout"
    Identifier "l0"
    Screen "s0"
EndSection